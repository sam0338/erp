<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>VEDA Hotel PMS</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/css/style.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.4/chart.umd.min.js"></script>
</head>
<body>
<div id="trialBanner" style="display:none;"></div>
<div class="app-shell">
  <aside class="sidebar">
    <div class="brand">VEDA<small>Hotel PMS</small></div>
    <div class="property-tag" id="propertyTag">Loading property…</div>
    <div id="propertySwitcherWrap"></div>

    <div class="nav-group">
      <div class="nav-label">Operations</div>
      <a class="nav-item" data-view="dashboard"><span class="dot"></span>Dashboard</a>
      <a class="nav-item" data-view="rooms"><span class="dot"></span>Rooms &amp; Housekeeping</a>
      <a class="nav-item" data-view="reservations"><span class="dot"></span>Reservations</a>
      <a class="nav-item" data-view="guests"><span class="dot"></span>Guests</a>
      <a class="nav-item" data-view="requests"><span class="dot"></span>Guest Requests</a>
    </div>

    <div class="nav-group">
      <div class="nav-label">Finance</div>
      <a class="nav-item" data-view="cashclosing"><span class="dot"></span>Cash Closing</a>
      <a class="nav-item" data-view="analytics"><span class="dot"></span>Analytics</a>
    </div>

    <div class="sidebar-footer">
      <div class="user-chip">
        <span class="name" id="userName">—</span>
        <span class="role" id="userRole">—</span>
      </div>
      <button class="logout-btn" id="logoutBtn">Sign out</button>
    </div>
  </aside>

  <main class="main" id="mainContent">
    <!-- views render here -->
  </main>
</div>

<div id="toast" class="toast"></div>
<div id="modalRoot"></div>

<script src="/js/api.js"></script>
<script src="/js/app.js"></script>
</body>
</html>
