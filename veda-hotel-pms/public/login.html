<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>VEDA Hotel PMS — Sign In</title>
<link rel="icon" type="image/x-icon" href="/img/favicon.ico">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@500;600;700&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/css/style.css">
<style>
  html, body { height: 100%; }
  body {
    background: #050c0b;
    display: flex; align-items: center; justify-content: center;
    padding: 28px;
  }

  .login-card {
    width: min(1280px, 96vw);
    height: min(720px, 92vh);
    border-radius: 26px;
    overflow: hidden;
    box-shadow: 0 40px 90px rgba(0,0,0,0.55);
    display: grid;
    grid-template-columns: 1.15fr 1fr;
  }

  /* ---------- Left hero panel ---------- */
  .login-visual {
    position: relative;
    background: linear-gradient(155deg, #123F3C 0%, #0A2C2B 55%, #071E1D 100%);
    color: #EAF3F1;
    display: flex; flex-direction: column; justify-content: space-between;
    padding: 40px 44px 34px;
    overflow: hidden;
  }

  .illustration-layer {
    position: absolute; inset: 0;
    opacity: 0.9;
  }
  .contrast-overlay {
    position: absolute; inset: 0;
    background: linear-gradient(100deg, #0A2C2B 0%, #0A2C2B 30%, rgba(10,44,43,0.55) 55%, rgba(10,44,43,0.15) 100%);
  }
  .ring-decor {
    position: absolute; right: -110px; top: -110px;
    width: 320px; height: 320px; border-radius: 50%;
    border: 1px solid rgba(234,243,241,0.08);
  }
  .ring-decor.small { right: -60px; top: -60px; width: 220px; height: 220px; border-color: rgba(234,243,241,0.06); }
  .arc-decor {
    position: absolute; left: -50px; bottom: -50px;
    width: 190px; height: 190px; border-radius: 50%;
    border: 1px solid rgba(184,146,90,0.15);
  }

  .visual-top, .visual-mid, .visual-bottom { position: relative; z-index: 2; }

  .brand-row { display: flex; align-items: baseline; gap: 3px; }
  .brand-wordmark { font-family: 'Inter', sans-serif; font-weight: 800; font-size: 32px; letter-spacing: 0.01em; color: #fff; line-height: 1; }
  .brand-triangle {
    width: 0; height: 0;
    border-left: 12px solid transparent; border-right: 12px solid transparent;
    border-bottom: 21px solid var(--brass);
    margin-left: 2px; transform: translateY(2px);
  }
  .brand-sub { font-family: 'Inter', sans-serif; font-size: 11px; font-weight: 600; letter-spacing: 0.3em; color: var(--brass-light); margin-top: 7px; }
  .brand-divider { width: 130px; height: 1px; background: rgba(184,146,90,0.4); margin: 14px 0; }

  .visual-quote {
    font-family: var(--font-display); font-size: 22px; line-height: 1.35; font-weight: 500;
    max-width: 320px; border-left: 2px solid rgba(184,146,90,0.5); padding-left: 16px;
  }
  .visual-quote .accent { color: var(--brass-light); }

  .feature-row { display: flex; gap: 18px; }
  .feature-item { display: flex; flex-direction: column; align-items: center; gap: 7px; width: 76px; text-align: center; }
  .feature-icon {
    width: 42px; height: 42px; border-radius: 50%;
    border: 1.3px solid rgba(184,146,90,0.5);
    background: rgba(7,30,29,0.4);
    display: flex; align-items: center; justify-content: center; color: var(--brass-light);
  }
  .feature-label { font-size: 9.5px; font-weight: 700; letter-spacing: 0.03em; text-transform: uppercase; color: rgba(234,243,241,0.75); line-height: 1.35; }

  /* ---------- Right form panel ---------- */
  .login-form-side { display: flex; align-items: center; justify-content: center; background: var(--paper); padding: 30px 24px; }
  .login-box { width: 100%; max-width: 320px; }

  .login-logo-badge {
    width: 64px; height: 64px; border-radius: 50%;
    background: var(--teal-900); border: 2px solid var(--brass);
    display: flex; align-items: center; justify-content: center; margin: 0 auto 16px;
    font-family: var(--font-display); font-weight: 700; font-size: 28px; color: var(--brass-light);
  }
  .login-box h2 { font-family: var(--font-display); font-size: 23px; font-weight: 600; color: var(--teal-900); text-align: center; margin-bottom: 8px; }
  .login-box .title-dot-rule { width: 58px; height: 2px; background: var(--brass); margin: 0 auto 26px; position: relative; }
  .login-box .title-dot-rule::after { content: ''; position: absolute; right: -3px; top: -3px; width: 7px; height: 7px; border-radius: 50%; background: var(--brass); }

  .field-group { margin-bottom: 15px; }
  .field-group label { display: block; font-size: 12px; font-weight: 700; color: var(--teal-900); margin-bottom: 6px; }
  .field-with-icon { position: relative; }
  .field-with-icon svg.field-icon { position: absolute; left: 13px; top: 50%; transform: translateY(-50%); color: var(--teal-700); pointer-events: none; }
  .field-with-icon input {
    width: 100%; padding: 11px 13px 11px 40px;
    border: 1.5px solid var(--line); border-radius: 8px;
    background: var(--paper-raised); color: var(--ink); font-size: 13.5px;
    transition: border-color 0.15s ease;
  }
  .field-with-icon input:focus { outline: none; border-color: var(--teal-700); }
  .field-with-icon .toggle-eye { position: absolute; right: 13px; top: 50%; transform: translateY(-50%); color: var(--ink-soft); cursor: pointer; background: none; border: none; padding: 2px; display: flex; }

  .login-error { display: none; background: var(--danger-bg); color: var(--danger); padding: 9px 11px; border-radius: var(--radius); font-size: 12px; margin-bottom: 14px; }

  .login-submit { width: 100%; justify-content: center; padding: 12px; font-size: 13.5px; border-radius: 8px; margin-top: 6px; gap: 8px; }

  .login-hint { margin-top: 18px; font-size: 11px; color: var(--ink-soft); text-align: center; line-height: 1.5; }

  @media (max-width: 860px) {
    .login-card { grid-template-columns: 1fr; height: auto; width: 94vw; }
    .login-visual { display: none; }
  }
</style>
</head>
<body>
<div class="login-card">
  <div class="login-visual">
    <svg class="illustration-layer" viewBox="0 0 700 720" preserveAspectRatio="xMidYMax slice" xmlns="http://www.w3.org/2000/svg">
      <!-- fluted wall panel behind desk -->
      <g opacity="0.5">
        <rect x="360" y="120" width="300" height="420" fill="#0d3532"/>
        <g stroke="#0a2a28" stroke-width="3">
          <line x1="380" y1="120" x2="380" y2="540"/>
          <line x1="404" y1="120" x2="404" y2="540"/>
          <line x1="428" y1="120" x2="428" y2="540"/>
          <line x1="452" y1="120" x2="452" y2="540"/>
          <line x1="476" y1="120" x2="476" y2="540"/>
          <line x1="500" y1="120" x2="500" y2="540"/>
          <line x1="524" y1="120" x2="524" y2="540"/>
          <line x1="548" y1="120" x2="548" y2="540"/>
          <line x1="572" y1="120" x2="572" y2="540"/>
          <line x1="596" y1="120" x2="596" y2="540"/>
          <line x1="620" y1="120" x2="620" y2="540"/>
        </g>
      </g>

      <!-- pendant lamps -->
      <g>
        <line x1="430" y1="0" x2="430" y2="200" stroke="#1a4b47" stroke-width="2"/>
        <ellipse cx="430" cy="205" rx="200" ry="130" fill="url(#glow1)"/>
        <path d="M410 195 Q430 175 450 195 L444 225 Q430 235 416 225 Z" fill="#0a2321"/>
        <ellipse cx="430" cy="225" rx="10" ry="3" fill="#F2C879" opacity="0.9"/>
      </g>
      <g>
        <line x1="540" y1="0" x2="540" y2="240" stroke="#1a4b47" stroke-width="2"/>
        <ellipse cx="540" cy="245" rx="170" ry="110" fill="url(#glow2)"/>
        <path d="M522 235 Q540 217 558 235 L553 262 Q540 271 527 262 Z" fill="#0a2321"/>
        <ellipse cx="540" cy="262" rx="9" ry="3" fill="#F2C879" opacity="0.9"/>
      </g>

      <!-- reception desk -->
      <rect x="330" y="470" width="330" height="90" rx="6" fill="#0c2e2b"/>
      <rect x="330" y="470" width="330" height="6" fill="#B8925A" opacity="0.55"/>
      <text x="495" y="522" font-family="Georgia, serif" font-size="20" letter-spacing="4" fill="#C9A46B" text-anchor="middle" opacity="0.85">RECEPTION</text>

      <!-- monitor on desk -->
      <rect x="470" y="430" width="46" height="34" rx="2" fill="#0a2321" stroke="#1a4b47" stroke-width="1.5"/>
      <rect x="488" y="464" width="10" height="10" fill="#0a2321"/>

      <!-- plant -->
      <g transform="translate(372,410)">
        <path d="M0 60 L-8 100 L8 100 Z" fill="#0a2321"/>
        <ellipse cx="0" cy="58" rx="18" ry="8" fill="#123F3C" stroke="#1a4b47" stroke-width="1.5"/>
        <path d="M0 58 C-10 20 -30 10 -34 -18" stroke="#2f6b5f" stroke-width="4" fill="none" stroke-linecap="round"/>
        <path d="M0 58 C6 10 24 4 30 -24" stroke="#2f6b5f" stroke-width="4" fill="none" stroke-linecap="round"/>
        <path d="M0 58 C-2 12 4 -6 2 -34" stroke="#3a7d6d" stroke-width="4" fill="none" stroke-linecap="round"/>
      </g>

      <defs>
        <radialGradient id="glow1" cx="50%" cy="20%" r="70%">
          <stop offset="0%" stop-color="#F2C879" stop-opacity="0.28"/>
          <stop offset="100%" stop-color="#F2C879" stop-opacity="0"/>
        </radialGradient>
        <radialGradient id="glow2" cx="50%" cy="20%" r="70%">
          <stop offset="0%" stop-color="#F2C879" stop-opacity="0.22"/>
          <stop offset="100%" stop-color="#F2C879" stop-opacity="0"/>
        </radialGradient>
      </defs>
    </svg>
    <div class="contrast-overlay"></div>
    <div class="ring-decor"></div>
    <div class="ring-decor small"></div>
    <div class="arc-decor"></div>

    <div class="visual-top">
      <div class="brand-row">
        <span class="brand-wordmark">VEDA</span>
        <span class="brand-triangle"></span>
      </div>
      <div class="brand-sub">HOTEL PMS</div>
      <div class="brand-divider"></div>
    </div>

    <div class="visual-mid">
      <div class="visual-quote">Every arrival, every room, every folio — <span class="accent">one system, under one roof.</span></div>
    </div>

    <div class="visual-bottom feature-row">
      <div class="feature-item">
        <div class="feature-icon">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M3 21h18M5 21V7l7-4 7 4v14M9 9h1M9 13h1M14 9h1M14 13h1M10 21v-4h4v4"/></svg>
        </div>
        <div class="feature-label">Smart<br>Operations</div>
      </div>
      <div class="feature-item">
        <div class="feature-icon">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/><path d="M9 12l2 2 4-4"/></svg>
        </div>
        <div class="feature-label">Secure<br>&amp; Reliable</div>
      </div>
      <div class="feature-item">
        <div class="feature-icon">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/></svg>
        </div>
        <div class="feature-label">Real-Time<br>Insights</div>
      </div>
      <div class="feature-item">
        <div class="feature-icon">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="9" cy="8" r="3.2"/><path d="M2.5 20c0-3.3 2.9-6 6.5-6s6.5 2.7 6.5 6"/><path d="M17 8.2a3 3 0 010 5.9"/><path d="M21.5 19.6c0-2.6-1.9-4.8-4.5-5.5"/></svg>
        </div>
        <div class="feature-label">Better<br>Experience</div>
      </div>
    </div>
  </div>

  <div class="login-form-side">
    <div class="login-box">
      <div class="login-logo-badge">V</div>
      <h2>Welcome Back</h2>
      <div class="title-dot-rule"></div>

      <div class="login-error" id="loginError"></div>
      <form id="loginForm">
        <div class="field-group">
          <label>Username</label>
          <div class="field-with-icon">
            <svg class="field-icon" width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="8" r="4"/><path d="M4 20c0-4.4 3.6-8 8-8s8 3.6 8 8"/></svg>
            <input type="text" id="username" autocomplete="username" required autofocus placeholder="Enter your username">
          </div>
        </div>
        <div class="field-group">
          <label>Password</label>
          <div class="field-with-icon">
            <svg class="field-icon" width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="4" y="11" width="16" height="9" rx="2"/><path d="M8 11V7a4 4 0 018 0v4"/></svg>
            <input type="password" id="password" autocomplete="current-password" required placeholder="Enter your password">
            <button type="button" class="toggle-eye" id="toggleEye" aria-label="Show password">
              <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M1 12s4-7 11-7 11 7 11 7-4 7-11 7-11-7-11-7z"/><circle cx="12" cy="12" r="3"/></svg>
            </button>
          </div>
        </div>
        <button type="submit" class="btn btn-primary login-submit">
          <span>Sign In</span>
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><path d="M9 8l4 4-4 4"/></svg>
        </button>
      </form>
      <div class="login-hint">Default admin login: <strong>admin</strong> / <strong>admin123</strong> — change this after first sign-in.</div>
    </div>
  </div>
</div>
<script>
document.getElementById('toggleEye').addEventListener('click', () => {
  const pw = document.getElementById('password');
  pw.type = pw.type === 'password' ? 'text' : 'password';
});

document.getElementById('loginForm').addEventListener('submit', async (e) => {
  e.preventDefault();
  const errorBox = document.getElementById('loginError');
  errorBox.style.display = 'none';
  const username = document.getElementById('username').value.trim();
  const password = document.getElementById('password').value;

  try {
    const res = await fetch('/api/auth/login', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ username, password })
    });
    const data = await res.json();
    if (!res.ok) {
      errorBox.textContent = data.error || 'Login failed';
      errorBox.style.display = 'block';
      return;
    }
    window.location.href = '/dashboard.html';
  } catch (err) {
    errorBox.textContent = 'Could not reach server. Is it running?';
    errorBox.style.display = 'block';
  }
});
</script>
</body>
</html>
