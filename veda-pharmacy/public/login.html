<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>VEDA Pharmacy — Sign In</title>
<link rel="icon" type="image/x-icon" href="/img/favicon.ico">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/css/style.css">
<style>
  html, body { height: 100%; }
  body {
    background: var(--navy);
    display: flex; align-items: center; justify-content: center;
    padding: 28px;
  }

  .login-card {
    width: min(1100px, 96vw);
    height: min(640px, 92vh);
    border-radius: 22px;
    overflow: hidden;
    box-shadow: 0 40px 90px rgba(0,0,0,0.5);
    display: grid;
    grid-template-columns: 1fr 1fr;
  }

  /* ---------- Left brand panel ---------- */
  .login-visual {
    position: relative;
    background: linear-gradient(155deg, var(--teal-dark) 0%, var(--navy) 60%, #0a0f1c 100%);
    color: #EAF3EC;
    display: flex; flex-direction: column; justify-content: space-between;
    padding: 40px 42px 34px;
    overflow: hidden;
  }
  .ring-decor { position: absolute; right: -100px; top: -100px; width: 300px; height: 300px; border-radius: 50%; border: 1px solid rgba(234,243,236,0.08); }
  .ring-decor.small { right: -50px; top: -50px; width: 200px; height: 200px; border-color: rgba(234,243,236,0.06); }
  .cross-decor { position: absolute; left: -30px; bottom: -30px; opacity: 0.08; }

  .visual-top, .visual-mid, .visual-bottom { position: relative; z-index: 2; }
  .brand-row { display: flex; align-items: baseline; gap: 6px; }
  .brand-wordmark { font-family: var(--font); font-weight: 800; font-size: 30px; letter-spacing: 0.01em; color: #fff; line-height: 1; }
  .brand-sub { font-family: 'Inter', sans-serif; font-size: 11px; font-weight: 700; letter-spacing: 0.3em; color: var(--accent-light); margin-top: 8px; text-transform: uppercase; }
  .brand-divider { width: 120px; height: 1px; background: rgba(200,127,23,0.4); margin: 14px 0; }

  .visual-quote { font-family: var(--font-display); font-size: 21px; line-height: 1.4; font-weight: 700; max-width: 320px; border-left: 2px solid rgba(200,127,23,0.5); padding-left: 16px; }
  .visual-quote .accent { color: var(--accent-light); }

  .feature-row { display: flex; gap: 16px; }
  .feature-item { display: flex; flex-direction: column; align-items: center; gap: 7px; width: 78px; text-align: center; }
  .feature-icon { width: 40px; height: 40px; border-radius: 50%; border: 1.3px solid rgba(200,127,23,0.5); background: rgba(8,33,22,0.4); display: flex; align-items: center; justify-content: center; color: var(--accent-light); }
  .feature-label { font-size: 9.5px; font-weight: 700; letter-spacing: 0.03em; text-transform: uppercase; color: rgba(234,243,236,0.75); line-height: 1.35; }

  /* ---------- Right form panel ---------- */
  .login-form-side { display: flex; align-items: center; justify-content: center; background: var(--paper); padding: 30px 24px; }
  .login-box { width: 100%; max-width: 320px; }

  .login-logo-badge { width: 60px; height: 60px; border-radius: 50%; background: var(--brand-900); border: 2px solid var(--accent); display: flex; align-items: center; justify-content: center; margin: 0 auto 16px; font-family: var(--font-display); font-weight: 800; font-size: 26px; color: var(--accent-light); }
  .login-box h2 { font-family: var(--font-display); font-size: 22px; font-weight: 800; color: var(--brand-900); text-align: center; margin-bottom: 8px; }
  .login-box .title-dot-rule { width: 54px; height: 2px; background: var(--accent); margin: 0 auto 26px; position: relative; }
  .login-box .title-dot-rule::after { content: ''; position: absolute; right: -3px; top: -3px; width: 7px; height: 7px; border-radius: 50%; background: var(--accent); }

  .field-group { margin-bottom: 15px; }
  .field-group label { display: block; font-size: 12px; font-weight: 700; color: var(--brand-900); margin-bottom: 6px; }
  .field-with-icon { position: relative; }
  .field-with-icon svg.field-icon { position: absolute; left: 13px; top: 50%; transform: translateY(-50%); color: var(--brand-700); pointer-events: none; }
  .field-with-icon input { width: 100%; padding: 11px 13px 11px 40px; border: 1.5px solid var(--line); border-radius: 8px; background: var(--paper-raised); color: var(--ink); font-size: 13.5px; transition: border-color 0.15s ease; }
  .field-with-icon input:focus { outline: none; border-color: var(--brand-700); }
  .field-with-icon .toggle-eye { position: absolute; right: 13px; top: 50%; transform: translateY(-50%); color: var(--ink-soft); cursor: pointer; background: none; border: none; padding: 2px; display: flex; }

  .login-error { display: none; background: var(--danger-bg); color: var(--danger); padding: 9px 11px; border-radius: var(--radius); font-size: 12px; margin-bottom: 14px; }
  .login-submit { width: 100%; justify-content: center; padding: 12px; font-size: 13.5px; border-radius: 8px; margin-top: 6px; gap: 8px; }
  .login-hint { margin-top: 18px; font-size: 11px; color: var(--ink-soft); text-align: center; line-height: 1.5; }

  @media (max-width: 860px) {
    .login-card { grid-template-columns: 1fr; height: auto; width: 94vw; }
    .login-visual { display: none; }
  }
</style>
</head>
<body>
<div class="login-card">
  <div class="login-visual">
    <svg class="cross-decor" width="260" height="260" viewBox="0 0 100 100"><rect x="40" y="0" width="20" height="100" fill="#fff"/><rect x="0" y="40" width="100" height="20" fill="#fff"/></svg>
    <div class="ring-decor"></div>
    <div class="ring-decor small"></div>

    <div class="visual-top">
      <div class="brand-row">
        <span class="brand-wordmark">VEDA</span>
      </div>
      <div class="brand-sub">Pharmacy</div>
      <div class="brand-divider"></div>
    </div>

    <div class="visual-mid">
      <div class="visual-quote">Every strip, every batch, every prescription — <span class="accent">tracked from shelf to sale.</span></div>
    </div>

    <div class="visual-bottom feature-row">
      <div class="feature-item">
        <div class="feature-icon">
          <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/></svg>
        </div>
        <div class="feature-label">FEFO<br>Stock Control</div>
      </div>
      <div class="feature-item">
        <div class="feature-icon">
          <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M14 2H6a2 2 0 00-2 2v16a2 2 0 002 2h12a2 2 0 002-2V8z"/><path d="M14 2v6h6"/><path d="M9 15h6M9 11h6"/></svg>
        </div>
        <div class="feature-label">Rx<br>Register</div>
      </div>
      <div class="feature-item">
        <div class="feature-icon">
          <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="12" r="10"/><path d="M9 12l2 2 4-4"/></svg>
        </div>
        <div class="feature-label">GST-Ready<br>Billing</div>
      </div>
    </div>
  </div>

  <div class="login-form-side">
    <div class="login-box">
      <div class="login-logo-badge">V</div>
      <h2>Welcome Back</h2>
      <div class="title-dot-rule"></div>

      <div class="login-error" id="loginError"></div>
      <form id="loginForm">
        <div class="field-group">
          <label>Username</label>
          <div class="field-with-icon">
            <svg class="field-icon" width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="8" r="4"/><path d="M4 20c0-4.4 3.6-8 8-8s8 3.6 8 8"/></svg>
            <input type="text" id="username" autocomplete="username" required autofocus placeholder="Enter your username">
          </div>
        </div>
        <div class="field-group">
          <label>Password</label>
          <div class="field-with-icon">
            <svg class="field-icon" width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="4" y="11" width="16" height="9" rx="2"/><path d="M8 11V7a4 4 0 018 0v4"/></svg>
            <input type="password" id="password" autocomplete="current-password" required placeholder="Enter your password">
            <button type="button" class="toggle-eye" id="toggleEye" aria-label="Show password">
              <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M1 12s4-7 11-7 11 7 11 7-4 7-11 7-11-7-11-7z"/><circle cx="12" cy="12" r="3"/></svg>
            </button>
          </div>
        </div>
        <button type="submit" class="btn btn-primary login-submit">
          <span>Sign In</span>
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><path d="M9 8l4 4-4 4"/></svg>
        </button>
      </form>
      <div class="login-hint">Default admin login: <strong>admin</strong> / <strong>admin123</strong> — change this after first sign-in.</div>
    </div>
  </div>
</div>
<script>
document.getElementById('toggleEye').addEventListener('click', () => {
  const pw = document.getElementById('password');
  pw.type = pw.type === 'password' ? 'text' : 'password';
});

document.getElementById('loginForm').addEventListener('submit', async (e) => {
  e.preventDefault();
  const errorBox = document.getElementById('loginError');
  errorBox.style.display = 'none';
  const username = document.getElementById('username').value.trim();
  const password = document.getElementById('password').value;

  try {
    const res = await fetch('/api/auth/login', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ username, password })
    });
    const data = await res.json();
    if (!res.ok) {
      errorBox.textContent = data.error || 'Login failed';
      errorBox.style.display = 'block';
      return;
    }
    // Consumed once by dashboard.js to show the near-expiry popup exactly
    // on a fresh login, not on every later sidebar click back to Dashboard.
    sessionStorage.setItem('vedaJustLoggedIn', '1');
    window.location.href = '/dashboard.html';
  } catch (err) {
    errorBox.textContent = 'Could not reach server. Is it running?';
    errorBox.style.display = 'block';
  }
});
</script>
</body>
</html>
